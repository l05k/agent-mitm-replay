[project]
name = "agent-mitm-replay"
version = "0.1.0"
description = "Record and replay agent model calls with mitmproxy"
requires-python = ">=3.13,<3.14"
dependencies = ["harbor==0.24.0", "mitmproxy==12.2.3"]

[project.scripts]
agent-mitm-replay = "agent_mitm_replay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mitm_replay"]

[dependency-groups]
dev = ["pytest>=8.4,<10"]
